<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gradBrand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF3131;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#990000;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Shape: Hexagon for "Structural Strength" -->
  <path d="M256 20 L480 140 V372 L256 492 L32 372 V140 Z" fill="#0A0A0A" stroke="url(#gradBrand)" stroke-width="20"/>

  <!-- Inner Mark: Stylized "L" + Lightning Bolt -->
  <!-- Vertical Bar -->
  <path d="M160 120 L220 120 L220 300 L350 300 L350 360 L160 360 Z" fill="white"/>
  
  <!-- Voltage Accent -->
  <path d="M220 120 L360 120 L300 220 L220 220 Z" fill="url(#gradBrand)" style="filter:url(#glow)"/>
  
</svg>
